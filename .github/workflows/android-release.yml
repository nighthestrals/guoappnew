name: Build Android release
permissions:
  contents: read
concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - &id001
      uses: actions/setup-go@v5
      with:
        go-version-file: native/go.mod
        cache-dependency-path: native/go.sum
    - &id002
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.4
        channel: stable
        cache: true
    - run: flutter pub get --enforce-lockfile
    - run: dart format --output=none --set-exit-if-changed lib test
      continue-on-error: true
    - run: dart analyze --fatal-infos lib test
      continue-on-error: true
    - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
      continue-on-error: true
    - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      continue-on-error: true
    - run: go test -race ./...
      working-directory: native
      continue-on-error: true
    - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
      working-directory: native
      continue-on-error: true
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nif [ \"$GITHUB_REF\" != \"refs/heads/main\" ]; then\n  echo \"只能从 main 分支手动发布，当前为 $GITHUB_REF。\"\
        \ >&2\n  exit 1\nfi\nversion=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)\nif [ -z \"$version\"\
        \ ]; then\n  echo \"pubspec.yaml 缺少 version。\" >&2\n  exit 1\nfi\ntag=\"app-v${version//+/-}\"\nif git ls-remote --exit-code\
        \ --tags origin \"refs/tags/$tag\" >/dev/null || gh release view \"$tag\" >/dev/null 2>&1; then\n  echo \"版本 $version（$tag）已发布过，请先提升\
        \ pubspec.yaml 的 version。\" >&2\n  exit 1\nfi\necho \"version=$version\" >> \"$GITHUB_OUTPUT\"\necho \"tag=$tag\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - edition: hongguojian
          arguments: ''
        - edition: zhenguojian
          arguments: --all-sources
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - *id001
    - *id002
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platforms;android-36
        accept-android-sdk-licenses: true
    - run: sdkmanager 'ndk;28.2.13676358'
    - name: Configure Android signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: "set -euo pipefail\nif [ -z \"$ANDROID_KEYSTORE_BASE64\" ]; then\n  echo \"未配置签名 Secrets，拒绝发布 debug 签名的 APK。\"\
        \ >&2\n  exit 1\nfi\nprintf '%s' \"$ANDROID_KEYSTORE_BASE64\" | tr -d '[:space:]' | base64 -d > \"$RUNNER_TEMP/release.jks\"\
        \necho \"ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks\" >> \"$GITHUB_ENV\"\n"
    - run: python scripts/build_android.py ${{ matrix.arguments }}
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - name: 校验 APK 签名证书
      shell: bash
      env:
        ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      run: "set -euo pipefail\nexpected=$(printf '%s' \"$ANDROID_CERT_SHA256\" | tr -d ': ' | tr '[:upper:]' '[:lower:]')\n\
        if [ -z \"$expected\" ]; then\n  echo \"未设置仓库变量 ANDROID_CERT_SHA256，无法确认发布证书。\" >&2\n  exit 1\nfi\napksigner=$(find\
        \ \"${ANDROID_HOME}/build-tools\" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)\nif [ -z \"$apksigner\"\
        \ ]; then\n  sdkmanager 'build-tools;35.0.0' >/dev/null\n  apksigner=$(find \"${ANDROID_HOME}/build-tools\" -name\
        \ apksigner -type f | sort | tail -n1)\nfi\necho \"apksigner：$apksigner\"\n\"$apksigner\" --version || true\nfor apk\
        \ in dist/android/*.apk; do\n  echo \"== $(basename \"$apk\")\"\n  output=$(\"$apksigner\" verify --print-certs \"\
        $apk\" 2>&1)\n  printf '%s\\n' \"$output\"\n  if ! printf '%s' \"$output\" | tr -d ':' | tr '[:upper:]' '[:lower:]'\
        \ | grep \"$expected\" >/dev/null; then\n    echo \"签名证书与发布证书不一致，已终止。\" >&2\n    exit 1\n  fi\ndone\n"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.edition }}-android
        path: dist/android/*
        if-no-files-found: error
        retention-days: 14
  release:
    needs:
    - checks
    - prepare
    - android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: release
        pattern: '*-android'
        merge-multiple: true
    - name: Verify packages and prepare draft Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.prepare.outputs.version }}
        TAG: ${{ needs.prepare.outputs.tag }}
        ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      run: "set -euo pipefail\nshopt -s nullglob\napks=(release/*.apk)\n[ \"${#apks[@]}\" -eq 6 ] || { echo \"Expected six\
        \ APKs\" >&2; exit 1; }\nfor edition in hongguojian zhenguojian; do\n  for abi in arm64-v8a armeabi-v7a x86_64; do\n\
        \    test -s \"release/${edition}-${VERSION}-${abi}.apk\"\n  done\ndone\n(cd release && sha256sum *.apk > SHA256SUMS.txt\
        \ && sha256sum -c SHA256SUMS.txt)\ncat > notes.md <<EOF\nAndroid ${VERSION}，由 nighthestrals/guoappnew 源码独立编译，使用本仓库固定发布签名。\n\
        \n- hongguojian：红果鉴，仅红果站源。\n- zhenguojian：真果鉴，全部站源。\n- arm64-v8a：多数现代安卓手机；armeabi-v7a：32 位设备；x86_64：对应架构设备或模拟器。\n\
        - 新签名不能覆盖 Xanerix 或其他证书签名的同包名应用。已有用户请先备份数据。\n- 应用内更新服务未配置，后续更新请从本仓库 Release 下载。\n- 本次提供构建与签名校验结果，未进行手机实测。上游检查流程保留，部分检查允许失败；具体结果见\
        \ Actions。\n\n源码提交：${GITHUB_SHA}\n构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n签名证书\
        \ SHA-256：${ANDROID_CERT_SHA256}\n附件 SHA256SUMS.txt 可用于校验下载完整性。\n\nEOF\nawk -v heading=\"## ${VERSION}\" '\n  $0 ==\
        \ heading { found = 1; next }\n  found && /^## / { exit }\n  found { print }\n' CHANGELOG.md >> notes.md\ngh release\
        \ create \"$TAG\" \"${apks[@]}\" release/SHA256SUMS.txt --draft --target \"$GITHUB_SHA\" --title \"红果鉴 / 真果鉴 ${VERSION}\
        \ · Android\" --notes-file notes.md\n"
'on':
  workflow_dispatch: null
